buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
    }
    dependencies {
        classpath("io.papermc.paperweight:paperweight-userdev:1.5.7")
    }
}

plugins {
    id("java")
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.18"
}

group = "org.vivecraft"
version = "1.21.7-1.0.1"

def paperVersion = "1.21.7-R0.1-SNAPSHOT"

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://jitpack.io" }
}

dependencies {
    paperweightDevelopmentBundle("io.papermc.paper:dev-bundle:${paperVersion}")
    compileOnly "com.github.MilkBowl:VaultAPI:1.7.1"
    compileOnly "io.netty:netty-all:4.1.86.Final"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

task copyPluginYml(type: Copy) {
    from "plugin.yml"
    into "$buildDir/resources/main"
}

task copyConfigYml(type: Copy) {
    from "config.yml"
    into "$buildDir/resources/main"
}

task copyConfigInstructionsYml(type: Copy) {
    from "config-instructions.yml"
    into "$buildDir/resources/main"
}

processResources.dependsOn copyPluginYml, copyConfigYml, copyConfigInstructionsYml 